# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Verify built source and version
        run: |
          echo "GIT SHA: $(git rev-parse HEAD)"
          echo "Release tag: ${{ github.event.release.tag_name }}"
          echo "pyproject.toml (head):"
          sed -n '1,200p' pyproject.toml || true
          echo "alfred/__init__.py (head):"
          sed -n '1,120p' alfred/__init__.py || true
          echo "dist contents:"
          ls -la dist || true

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      url: https://pypi.org/project/Alfred-Exoplanets/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Show built artifacts
        run: |
          echo "dist:"
          ls -la dist || true
          ls dist/*.tar.gz || true

      - name: Extract built version from sdist
        id: built_version
        run: |
          set -euxo pipefail
          sdist=$(ls dist/*.tar.gz | head -n1 || true)
          if [ -z "$sdist" ]; then
            echo "error=no_sdist" >> $GITHUB_OUTPUT
            exit 1
          fi
          fn=$(basename "$sdist")
          # Try to extract pattern like name-version.tar.gz
          ver=$(echo "$fn" | sed -E 's/.*-([0-9]+(\.[0-9]+)*)(\.post[0-9]+|[a-zA-Z0-9.+-]*)?\.tar\.gz$/\1/')
          echo "sdist=$sdist" >> $GITHUB_OUTPUT
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Check built version matches release tag
        run: |
          set -euxo pipefail
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          built="${{ steps.built_version.outputs.version }}"
          echo "release tag (no v): $tag"
          echo "built version: $built"
          if [ "$tag" != "$built" ]; then
            echo "ERROR: built version ($built) does not match release tag ($tag). Aborting publish."
            exit 1
          fi

      - name: Publish to PyPI (twine --skip-existing)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --skip-existing dist/*

      - name: Skip publish (if already exists)
        if: ${{ failure() }}
        run: echo "Publish failed or skipped."
